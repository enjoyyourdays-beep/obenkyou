<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>おべんきょう</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Hiragino Sans',sans-serif;background:#f8fafc;color:#182235}main{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}.menu{display:grid;gap:16px;width:min(100%,440px)}button{cursor:pointer;border:0;border-radius:15px;padding:20px;font-size:25px;background:white;box-shadow:0 2px 10px #0001}.menu small{display:block;font-size:14px;color:#64748b}.back{position:absolute;top:16px;left:16px;font-size:16px;padding:12px;background:#e2e8f0}.stage{width:100%;flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer}.question{font-weight:bold;font-size:clamp(56px,16vw,130px);white-space:nowrap}.kana{font-size:clamp(110px,40vw,290px)}.word{font-size:clamp(54px,15vw,110px)}.timer{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:32px;font-variant-numeric:tabular-nums}.count{position:absolute;bottom:24px;right:18px;color:#64748b}</style></head><body><main id="app"></main><script>
const app=document.getElementById('app');const letters=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'];let mode='',problems=[],index=0,phase='',started=0,elapsed=0,tick=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stop(){if(tick!==null)clearInterval(tick);tick=null}
function clock(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function refresh(){let el=document.getElementById('timer');if(el)el.textContent=clock(phase==='running'?performance.now()-started:elapsed)}
function home(){stop();mode='';phase='home';app.innerHTML='<h1>おべんきょう</h1><p>やりたい べんきょうを えらんでね</p><div class="menu"><button data-m="add">＋ たしざん<small>64もん</small></button><button data-m="sub">− ひきざん<small>66もん</small></button><button data-m="kana">あ ひらがな<small>46もじ</small></button></div>';document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>begin(b.dataset.m))}
function begin(m){stop();mode=m;problems=[];if(m==='kana')problems=[...letters];else for(let a=0;a<=(m==='add'?9:10);a++)for(let b=0;b<=(m==='add'?9:10);b++)if(m==='add'?a+b<=10:a>=b)problems.push([a,b]);shuffle(problems);index=0;elapsed=0;phase=m==='kana'?'running':'ready';show()}
function next(){if(phase==='ready'){phase='running';started=performance.now();tick=setInterval(refresh,200);show();return}if(phase!=='running')return;index++;if(index===problems.length){elapsed=performance.now()-started;stop();phase='done'}show()}
function show(){let ready=phase==='ready',done=phase==='done',value=ready?'はじめる':done?'おわり':mode==='kana'?problems[index]:`${problems[index][0]} ${mode==='add'?'＋':'−'} ${problems[index][1]} ＝`;app.innerHTML='<button class="back" id="back">← もどる</button><div class="stage" id="stage" role="button" tabindex="0"><div id="q" class="question '+(ready||done?'word':mode==='kana'?'kana':'')+'"></div></div><div class="count" id="count"></div>'+(mode==='kana'?'':'<div class="timer" id="timer"></div>');document.getElementById('q').textContent=value;document.getElementById('count').textContent=ready||done?'':`${index+1} / ${problems.length}`;document.getElementById('back').onclick=home;document.getElementById('stage').onclick=next;refresh()}
document.addEventListener('keydown',e=>{if(mode&&(e.key==='ArrowDown'||e.key==='ArrowRight')){e.preventDefault();if(!e.repeat)next()}});home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
